name: Build and Deploy to Azure App Service

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

env:
  NODE_VERSION: '22.22.2'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Prepare standalone deployment package
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          # Override start script: standalone bundle has no `next` binary;
          # boots via the self-contained server.js
          node -e "const p=require('./.next/standalone/package.json'); p.scripts.start='node server.js'; require('fs').writeFileSync('./.next/standalone/package.json', JSON.stringify(p,null,2))"

      - name: Deploy to production (Run-From-Package), with rollback
        env:
          APP_NAME: ${{ secrets.AZURE_APP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONN_STR: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          set -euo pipefail

          STORAGE_ACCOUNT=$(echo "$CONN_STR" | grep -oP '(?<=AccountName=)[^;]+')
          ACCOUNT_KEY=$(echo "$CONN_STR" | grep -oP '(?<=AccountKey=)[^;]+')

          # Remember what production is serving now. This is the rollback target,
          # which is why the package below is versioned per commit rather than
          # overwriting a single deploy-latest.zip — overwriting would destroy
          # the artifact we need to roll back to.
          PREVIOUS=$(az webapp config appsettings list \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)
          echo "Current package: ${PREVIOUS:-<none>}"

          cd .next/standalone
          zip -r ../../deploy.zip . -q
          cd ../..

          az storage container create \
            --name deployments --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" --output none 2>/dev/null || true

          BLOB="deploy-${GITHUB_SHA}.zip"
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" \
            --container-name deployments --name "$BLOB" \
            --file deploy.zip --overwrite --output none

          # The SAS must outlive the deployment: App Service re-reads the package
          # on every restart, so a short-lived token would break the app later,
          # not at deploy time. Tracked as wishlist #8 (still open).
          EXPIRY=$(date -u -d "+10 years" +%Y-%m-%dT%H:%MZ)
          SAS=$(az storage blob generate-sas \
            --account-name "$STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" \
            --container-name deployments --name "$BLOB" \
            --permissions r --expiry "$EXPIRY" --https-only -o tsv)

          NEW_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/deployments/${BLOB}?${SAS}"

          apply() {
            az webapp config appsettings set \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --settings "WEBSITE_RUN_FROM_PACKAGE=$1" --output none
            az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
          }

          # /login is unauthenticated and always 200; / redirects to it.
          healthy() {
            local url="https://$(az webapp show --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" --query defaultHostName -o tsv)"
            for i in $(seq 1 18); do
              STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$url/login" || echo 000)
              [ "$STATUS" = "200" ] && { echo "Healthy (/login 200)"; return 0; }
              echo "Attempt $i: /login HTTP $STATUS, waiting..."
              sleep 10
            done
            return 1
          }

          echo "Deploying $BLOB ..."
          apply "$NEW_URL"

          # No staging slot to verify against: the app runs on F1 Free, which does
          # not support slots (wishlist #32). Production is validated after the
          # fact and reverted if the check fails.
          if healthy; then
            echo "Deployment succeeded."
          else
            echo "::error::Health check failed - rolling back"
            if [ -n "${PREVIOUS:-}" ]; then
              apply "$PREVIOUS"
              healthy && echo "::warning::Rolled back to previous package" \
                       || echo "::error::Rollback did not become healthy"
            else
              echo "::error::No previous package recorded - cannot roll back"
            fi
            exit 1
          fi
